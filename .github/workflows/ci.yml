name: Domain Repository CI

on:
  push:
    paths:
      - 'domain-repository/**'
  pull_request:
    paths:
      - 'domain-repository/**'

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domain-repository
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=domain_repository --cov-report=xml
      - name: Run mypy (type checking)
        run: |
          poetry run mypy domain_repository
      - name: Run flake8 (lint)
        run: |
          poetry run flake8 domain_repository
      - name: Run black (format check)
        run: |
          poetry run black --check domain_repository
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
